[package]
name = "taffy_blueprint"
version = "0.1.3"
authors = ["Stephane Matiz <stephane.matiz@gmail.com>"]
edition = "2021"
rust-version = "1.65"
# include = ["src/**/*", "examples/**/*", "Cargo.toml", "README.md"]
description = "A blueprint on top of a flexible UI layout library Taffy"
# repository = "https://github.com/stephane.matiz/taffy_blueprint"
keywords = ["taffy", "macroquad", "hot-reload", "declarative"]
categories = ["gui"]
license = "MIT"

[dependencies]
taffy = { version = "0.9.2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
macroquad = { version = "0.4.14", optional = true }
serde_json = { version = "1.0.149", optional = true }
regex = { version = "1.12.2", optional = true }
once_cell =  { version ="1.21.3", optional = true }
# [package.metadata.docs.rs]
# # To test all the documentation related features, run:
# # RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc -Zunstable-options -Zrustdoc-scrape-examples --all-features --no-deps --open

# all-features = true
# # see https://doc.rust-lang.org/nightly/rustdoc/scraped-examples.html
# cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
# rustdoc-args = ["--cfg", "docsrs"]

[features]
use_macroquad = ["macroquad"]
use_json = ["serde_json", "regex", "once_cell"]

[dev-dependencies]
macroquad = "0.4.14"
serde_jsonrc = "0.1.0"
notify = "8.2.0"

# # Enable default features for tests and examples
# taffy = { path = "." }

# [profile.release]
# lto = true
# panic = 'abort'

# [[bench]]
# name = "dummy_benchmark"
# path = "benches/dummy_benchmark.rs"
# harness = false

[[example]]
name = "basic"


[[example]]
name = "json_hot_reloading"

# # This causes all the examples to be scraped for documentation, not just the basic example
# doc-scrape-examples = true

[workspace]
# members = [ ".", "examples/json_hot_reloading.rs", "examples/basic.rs", ]
# members = ["taffy_macroquad"]
# The cosmic_text example and benches are excluded from the workspace as including them breaks compilation
# of all crates in the workspace with our MSRV compiler
# exclude = ["examples/cosmic_text", "benches"]
