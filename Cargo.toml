[package]
name = "taffy_blueprint"
version = "0.0.1"
authors = ["Stephane Matiz <stephane.matiz@gmail.com>"]
edition = "2021"
rust-version = "1.65"
# include = ["src/**/*", "examples/**/*", "Cargo.toml", "README.md"]
description = "A blueprint on top of a flexible UI layout library "
# repository = "https://github.com/DioxusLabs/taffy"
keywords = [
    "blueprint",
    "macroquad",
    "hot-reload",
    "taffy",
    "cross-platform",
    "layout",
    "flexbox",
    "css-grid",
    "grid",
]
categories = ["gui"]
license = "MIT"

[dependencies]
taffy = { version = "0.9.2", features = ["serde"] }
# ,  "std",  "grid"
serde = { version = "1.0.228", features = ["derive"] }
macroquad = { version = "0.4.14", optional = true }
serde_json = { version = "1.0.149", optional = true }

# [package.metadata.docs.rs]
# # To test all the documentation related features, run:
# # RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc -Zunstable-options -Zrustdoc-scrape-examples --all-features --no-deps --open

# all-features = true
# # see https://doc.rust-lang.org/nightly/rustdoc/scraped-examples.html
# cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
# rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
debug = []
release = []
for_test = []
use_macroquad = ["macroquad"]
use_json = ["serde_json"]

[dev-dependencies]
macroquad = "0.4.14"
serde_json = "1.0.149"
notify = "8.2.0"
# serde_json = "1.0.93"
# taffy_test_helpers = { path = "tests/common" }

# # Enable default features for tests and examples
# taffy = { path = "." }

# [profile.release]
# lto = true
# panic = 'abort'

# [[bench]]
# name = "dummy_benchmark"
# path = "benches/dummy_benchmark.rs"
# harness = false

# [[example]]
# name = "basic"
# # This causes all the examples to be scraped for documentation, not just the basic example
# doc-scrape-examples = true

[workspace]
# members = ["taffy_macroquad"]
